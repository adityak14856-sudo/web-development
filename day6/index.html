<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Froms-learn it</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>For to apply for sigma web devlopment course -TA</h1>
    <form action="post">
      <div>
        <label for="username">Enter your user name</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder=" Enter your name"
        />
      </div>
      <div>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
        <input
          type="radio"
          id="trensgender"
          name="gender"
          value="trensgender"
        />

        <label for="trensgender">Trensgender</label>
      </div>
      <div>
        <input type="checkbox" id="subscribe" value="yes" />
        <label for="subscribe">subscribe to newsletter</label>
      </div>
      <div>
        <label for="comment">Enter your comments</label><br />
        <textarea name="comment" rows="4" cols="50">
Enter your comment here...</textarea
        >
      </div>
      <div>
        <select name="fruits">
          <option value="apple">Apple</option>
          <option value="banana">Bnanana</option>
          <option value="cherry">Cherry</option>
          <option value="non of this">non of this</option>
        </select>
      </div>
    </form>
  </body>
</html>
